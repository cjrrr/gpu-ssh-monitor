[metadata]
name = gpu-ssh-monitor
version = 0.1.1
description = Monitor NVIDIA GPUs across SSH hosts in one terminal.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    gsm = gpu_ssh_monitor.cli:main
